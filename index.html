<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOVE ECONOMY - BIBLE PROJECTOR</title>
<style>body{background:#0a1a4a;color:#fff;font-family:Arial;margin:0;padding:10px} .top{display:flex;gap:8px} .top button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:900} .box{border:3px solid #ffcc00;border-radius:15px;padding:12px;margin-top:10px;background:#0a1a4a} .yellow{background:#ffcc00;color:#000;text-align:center;padding:10px;border-radius:10px;font-weight:900} h2{text-align:center;color:#ffcc00} #verse{font-size:24px;line-height:1.5;text-align:center;min-height:120px} .row{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap} .row button{padding:10px 14px;border-radius:8px;border:none;font-weight:900;cursor:pointer} .green{background:#00c853;color:#fff} .gold{background:#ffcc00} .blue{background:#1e3a8a;color:#fff} .red{background:#ff1744;color:#fff;width:100%;padding:14px;font-size:16px} input{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;color:#000;font-size:18px;text-align:center} #heard{background:#000;padding:12px;text-align:center;border-radius:10px}</style></head>
<body>
<div class="top"><button style="background:#ffcc00">Light</button><button style="background:#1e3a8a;color:#fff">Dark</button><button style="background:#00c853;color:#fff">History</button></div>
<div class="box"><div class="yellow">📺 LIVE PROJECTION SCREEN</div><h2 id="ref">JOHN 3:16 (KJV)</h2><div id="verse">Loading...</div>
<div class="row"><button class="green" onclick="move(-1)">◀ PREV</button><button class="green" onclick="move(1)">NEXT ▶</button><button class="gold" onclick="size(2)">A+</button><button class="gold" onclick="size(-2)">A-</button></div>
<div class="row" id="vers"></div></div>
<div class="box"><div class="yellow">⚙️ CONTROLS + VOICE + MEDIA</div><button class="red" onclick="voice()">🎤 START VOICE SEARCH</button><div id="heard">Heard: "John 3:16"</div>
<input id="inp" placeholder="Type e.g. Mark 1:11" value="John 3:16"><button class="gold" style="width:100%;padding:14px" onclick="load(document.getElementById('inp').value)">SHOW VERSE</button></div>
<script>
let cur={book:"John",ch:3,v:16},ver="kjv",fs=24;
let versions=["KJV","NKJV","NIV","ESV","NLT","AMP","NASB","RSV","ASV","CSB","MSG","GNT","CEV","WEB","YLT","DARBY","BBE","NET","HCSB","TPT"];
document.getElementById('vers').innerHTML=versions.map(v=>`<button class="blue" onclick="setV('${v}')">${v}</button>`).join('');
function setV(v){ver=v;load(cur.book+" "+cur.ch+":"+cur.v)}
function size(d){fs+=d;document.getElementById('verse').style.fontSize=fs+'px'}
function move(d){cur.v+=d;if(cur.v<1)cur.v=1;load(cur.book+" "+cur.ch+":"+cur.v)}
async function load(q){
  if(!q)return; document.getElementById('heard').innerText='Heard: "'+q+'"';
  let m=q.match(/([1-3]?\s?[A-Za-z]+)\s+(\d+):(\d+)/); if(m){cur={book:m[1].trim(),ch:+m[2],v:+m[3]}}
  document.getElementById('ref').innerText=(cur.book+" "+cur.ch+":"+cur.v+" ("+ver+")").toUpperCase();
  document.getElementById('verse').innerText="Loading...";
  let t=ver.toLowerCase(); if(!["kjv","asv","cherokee","web"].includes(t)) t="kjv";
  try{let r=await fetch("https://bible-api.com/"+encodeURIComponent(cur.book+" "+cur.ch+":"+cur.v)+"?translation="+t); let j=await r.json(); document.getElementById('verse').innerText=""["+ver+"] "+cur.book+" "+cur.ch+":"+cur.v+" — "+j.text.trim()+""";}catch(e){document.getElementById('verse').innerText="No internet. Check connection and try again."}
}
function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R){alert("Voice not supported, type instead");return} let r=new R(); r.onresult=e=>{let t=e.results[0][0].transcript; document.getElementById('inp').value=t; load(t)}; r.start()}
load("John 3:16");
</script></body></html>
